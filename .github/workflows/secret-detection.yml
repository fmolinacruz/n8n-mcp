name: Secret Detection

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  detect-secrets:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up scanning tools
        run: |
          # We'll use git grep and pattern matching for secret detection
          # This is a lightweight alternative to tools like gitleaks or truffleHog
          echo "Setting up secret scanning..."
      
      - name: Scan for API keys and tokens
        run: |
          echo "Scanning for potential secrets in staged/committed files..."
          echo ""
          
          # Define patterns to search for
          PATTERNS=(
            "api[_-]?key"
            "apikey"
            "api[_-]?secret"
            "access[_-]?token"
            "auth[_-]?token"
            "bearer[[:space:]]"
            "password[[:space:]]*[:=]"
            "passwd[[:space:]]*[:=]"
            "AKIA[0-9A-Z]{16}"
            "aws[_-]?access[_-]?key"
            "aws[_-]?secret"
            "gh[ps]_[A-Za-z0-9_]{36}"
            "-----BEGIN.*PRIVATE KEY-----"
            "n8n[_-]?api[_-]?key"
            "notion[_-]?api[_-]?key"
          )
          
          # Files to exclude from scanning
          EXCLUDE_PATHS=(
            ".git"
            "node_modules"
            "dist"
            "coverage"
            "*.md"
            "*.log"
            "*.db"
            ".env.example"
            ".env.test.example"
            "operations/scripts/pre-commit-secret-check.sh"
            ".github/workflows/secret-detection.yml"
          )
          
          # Build exclude arguments for grep
          EXCLUDE_ARGS=""
          for exclude in "${EXCLUDE_PATHS[@]}"; do
            EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude=$exclude"
          done
          
          FINDINGS=0
          WARNINGS=0
          
          for pattern in "${PATTERNS[@]}"; do
            echo "Checking pattern: $pattern"
            
            # Search for pattern in all files
            RESULTS=$(grep -riIn $EXCLUDE_ARGS "$pattern" . 2>/dev/null || true)
            
            if [ -n "$RESULTS" ]; then
              echo "$RESULTS" | while IFS= read -r line; do
                # Check if it's a false positive
                if echo "$line" | grep -qiE "(example|placeholder|fake|mock|test|dummy|sample|TODO|FIXME|\.md:)"; then
                  ((WARNINGS++))
                  echo "⚠️  Possible secret (likely false positive): $line"
                else
                  ((FINDINGS++))
                  echo "❌ Potential secret found: $line"
                fi
              done
            fi
          done
          
          echo ""
          echo "==================================="
          echo "Secret Scan Results"
          echo "==================================="
          echo "Potential secrets: $FINDINGS"
          echo "Warnings (likely false positives): $WARNINGS"
          echo ""
          
          if [ $FINDINGS -gt 0 ]; then
            echo "❌ CRITICAL: Potential secrets detected!"
            echo ""
            echo "If these are false positives:"
            echo "  1. Add 'example', 'placeholder', or 'fake' to the values"
            echo "  2. Move real secrets to .env files (in .gitignore)"
            echo "  3. Update the exclude patterns in this workflow"
            echo ""
            exit 1
          elif [ $WARNINGS -gt 0 ]; then
            echo "⚠️  Some warnings detected, but scan passed."
            echo "Please review the warnings above."
          else
            echo "✓ No secrets detected"
          fi
      
      - name: Scan for hardcoded URLs with credentials
        run: |
          echo ""
          echo "Scanning for URLs with embedded credentials..."
          
          # Pattern: protocol://username:password@host
          RESULTS=$(grep -riIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
                    --exclude="*.md" --exclude="*.log" \
                    "://[^:@[:space:]]+:[^:@[:space:]]+@" . 2>/dev/null || true)
          
          if [ -n "$RESULTS" ]; then
            echo "$RESULTS" | while IFS= read -r line; do
              # Check if it's an example or documentation
              if echo "$line" | grep -qiE "(example|placeholder|dummy|documentation|docs)"; then
                echo "⚠️  URL with credentials in documentation: $line"
              else
                echo "❌ Hardcoded credentials in URL: $line"
                exit 1
              fi
            done
          else
            echo "✓ No hardcoded credentials in URLs"
          fi
      
      - name: Check for exposed .env files
        run: |
          echo ""
          echo "Checking for accidentally committed .env files..."
          
          # List .env files (excluding examples)
          ENV_FILES=$(find . -name ".env" -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null || true)
          
          if [ -n "$ENV_FILES" ]; then
            echo "❌ .env files found in repository:"
            echo "$ENV_FILES"
            echo ""
            echo ".env files should be in .gitignore and never committed!"
            exit 1
          else
            echo "✓ No .env files committed"
          fi
      
      - name: Scan git history for secrets (last 10 commits)
        if: github.event_name == 'push'
        run: |
          echo ""
          echo "Scanning recent commit history for accidentally committed secrets..."
          
          # Only check recent commits to avoid long scan times
          COMMITS=$(git log --format="%H" -10)
          
          FOUND=0
          
          for commit in $COMMITS; do
            echo "Checking commit: $commit"
            
            # Get diff for commit
            DIFF=$(git show $commit 2>/dev/null || true)
            
            # Check for added lines with potential secrets
            SECRET_PATTERNS=(
              "^\+.*api[_-]?key.*[:=].*[A-Za-z0-9_\-]{20,}"
              "^\+.*token.*[:=].*[A-Za-z0-9_\-]{20,}"
              "^\+.*password.*[:=]"
              "^\+.*AKIA[0-9A-Z]{16}"
            )
            
            for pattern in "${SECRET_PATTERNS[@]}"; do
              MATCHES=$(echo "$DIFF" | grep -iE "$pattern" || true)
              
              if [ -n "$MATCHES" ]; then
                # Check if it's a false positive
                if echo "$MATCHES" | grep -qiE "(example|placeholder|fake|mock|test|\.env\.example)"; then
                  continue
                fi
                
                echo "⚠️  Potential secret in commit $commit:"
                echo "$MATCHES" | head -3
                ((FOUND++))
              fi
            done
          done
          
          if [ $FOUND -gt 0 ]; then
            echo ""
            echo "⚠️  Found $FOUND potential secret(s) in recent commits"
            echo "Please review these commits and rotate any exposed credentials"
            # Don't fail, just warn - secrets might already be rotated
          else
            echo "✓ No secrets found in recent commits"
          fi

  trufflehog-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the build, just report
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  summary:
    name: Secret Detection Summary
    runs-on: ubuntu-latest
    needs: [detect-secrets, trufflehog-scan]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "==================================="
          echo "Secret Detection Summary"
          echo "==================================="
          echo ""
          echo "Pattern-based scan: ${{ needs.detect-secrets.result }}"
          echo "TruffleHog scan: ${{ needs.trufflehog-scan.result }}"
          echo ""
          
          if [ "${{ needs.detect-secrets.result }}" == "failure" ]; then
            echo "❌ Secret detection failed - potential secrets found!"
            exit 1
          elif [ "${{ needs.trufflehog-scan.result }}" == "failure" ]; then
            echo "⚠️  TruffleHog found potential secrets (review required)"
            # Don't fail on TruffleHog - it can have false positives
          else
            echo "✓ All secret detection checks passed"
          fi
